<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>동화책 무드 영상</title>
<style>
  /* 신춘문예 희곡 3편을 읽고 떠올린 상상 장면을 '그림책이 살아 움직이는' 영상으로 보여 주는 페이지 */
  :root { --bg:#14110e; --text:#f1ebe0; --muted:#b9ae9c; --accent:#e58a92; }
  body { margin:0; background:var(--bg); color:var(--text); font-family:"Malgun Gothic","Apple SD Gothic Neo",sans-serif; }
  .wrap { max-width:1000px; margin:0 auto; padding:16px; }
  h1 { font-size:1.3rem; margin:8px 0; }
  p.note { color:var(--muted); line-height:1.6; margin:4px 0 12px; }
  canvas { width:100%; height:auto; aspect-ratio:16/9; background:#000; border-radius:10px; display:block; }
  .row { display:flex; flex-wrap:wrap; gap:10px; margin:12px 0; align-items:center; }
  button, a.dl { min-height:44px; padding:8px 18px; border-radius:10px; border:2px solid var(--accent); background:transparent;
    color:var(--accent); font:inherit; font-weight:700; cursor:pointer; text-decoration:none; display:inline-flex; align-items:center; }
  button.primary { background:var(--accent); color:#2a0f12; }
  button:disabled { opacity:.5; cursor:not-allowed; }
  #status, #clock { color:var(--muted); }
  #scrub { flex:1 1 260px; min-width:200px; accent-color:var(--accent); }
  .scenes { display:flex; flex-wrap:wrap; gap:6px; align-items:center; }
  .scenes .grp { color:var(--muted); font-size:.85rem; margin:0 2px 0 8px; }
  .scenes button { min-height:36px; min-width:36px; padding:2px 8px; font-size:.9rem; }
  .scenes button.on { background:var(--accent); color:#2a0f12; }
  label.opt { display:inline-flex; align-items:center; gap:6px; min-height:44px; color:var(--muted); }
  select { min-height:40px; border-radius:8px; border:2px solid var(--accent); background:var(--bg); color:var(--text); font:inherit; padding:2px 8px; }
  input[type=checkbox] { width:20px; height:20px; accent-color:var(--accent); }
  #vol { width:120px; accent-color:var(--accent); }
</style>
</head>
<body>
<div class="wrap">
  <h1>📖 동화책 무드 영상</h1>
  <p class="note">신춘문예 희곡 3편의 작품 소개를 읽고 <b>떠올린 상상 장면</b>을 그림책처럼 그려 본 무드 영상이에요.
     원작 장면을 그대로 옮긴 것이 아니고 대사도 인용하지 않았어요. 배우가 장면의 분위기와 감정을 그림으로 먼저 느껴 보는 연습용이에요.
     그림과 소리(음악·효과음)는 모두 이 화면에서 직접 그리고 만든 것이라 외부 그림·음원을 쓰지 않았어요.</p>
  <canvas id="cv" width="1920" height="1080" aria-label="동화책 스타일 무드 영상 화면"></canvas>
  <div class="row">
    <button id="play" class="primary" type="button">▶ 재생</button>
    <button id="pause" type="button">⏸ 일시정지</button>
    <button id="stop" type="button">■ 정지(처음으로)</button>
    <input id="scrub" type="range" min="0" max="100" step="0.01" value="0" aria-label="영상 위치">
    <span id="clock">0.0 / 0.0초</span>
  </div>
  <div class="row scenes" id="sceneRow" aria-label="장면으로 바로가기"></div>
  <div class="row">
    <label class="opt"><input type="checkbox" id="snd" checked> 🔊 소리</label>
    <input id="vol" type="range" min="0" max="1" step="0.01" value="0.8" aria-label="소리 크기">
    <label class="opt">화질
      <select id="quality" aria-label="화질">
        <option value="1080" selected>1080p (선명)</option>
        <option value="720">720p (가벼움 · 컴퓨터가 느릴 때)</option>
      </select></label>
  </div>
  <div class="row">
    <button id="rec" type="button">⏺ 영상 파일로 저장 (.webm, 소리 포함)</button>
    <span id="status" role="status" aria-live="polite"></span>
  </div>
  <div class="row" id="dlRow"></div>
</div>

function clamp(x, a, b) { return x < a ? a : x > b ? b : x; }

function lerp(a, b, t) { return a + (b - a) * t; }

function vnoise(x, y) {                                                                                           // 부드러운 노이즈
  var xi = Math.floor(x), yi = Math.floor(y), xf = x - xi, yf = y - yi;
  var u = xf * xf * (3 - 2 * xf), v = yf * yf * (3 - 2 * yf);
  var a = hsh(xi, yi), b = hsh(xi + 1, yi), c = hsh(xi, yi + 1), d = hsh(xi + 1, yi + 1);
  return lerp(lerp(a, b, u), lerp(c, d, u), v);

function chime(c, t, ch, v) { ch.forEach(function (n, k) { note(c, t + k * 0.17, 'box', c.m.root + 24 + n, v, (k - 1) * 0.4); }); }
(function buildSound() {
  var ws = {};
  items.forEach(function (it, idx) {
    if (it.kind === 'title') ws[it.wi] = it.start;
    if (idx > 0) {                                  // 장면 사이 전환 소리
      if (items[idx - 1].kind === 'scene' && it.kind === 'scene') ev(it.start - 0.1, 0, false, function (S, w) { iWhoosh(S, w); });
      else ev(it.start, 0, false, function (S, w) { iPage(S, w); });
    }
    var w = it.w || STORY.works[0], end = it.start + it.dur;
    function C(a, b, chords, seed, cut) { return { it: it, m: w.music, chords: chords || w.music.chords, ws: it.kind === 'end' ? it.start : ws[it.wi], a: a, b: b, rng: mulberry(seed), cut: cut }; }
    if (it.kind === 'title') {
      padRange(C(it.start, end, null, 1), { cut: w.music.cut * 0.8, g: 0.7 });
      chime(C(it.start, end, null, 2), it.start + 0.7, w.music.chords[0], 0.8);
    } else if (it.kind === 'end') {
      var ce = C(it.start, end + 1.5, null, 3);
      ev(it.start, it.dur + 1, true, function (S, wt, off, d) { iPad(S, wt, d, off, [53, 57, 60, 64, 41], { cut: 1000, g: 0.9 }); });
      chime(ce, it.start + 0.8, [0, 4, 7, 12], 0.8);
    } else {
      var sc = it.sc, chords = sc.chords || null;
      (sc.snd || '').split(/\s+/).filter(Boolean).forEach(function (tok, k) {
        var parts = tok.split('@'), name = parts[0], a = it.start, b = end, cut = false;
        if (parts[1]) { var r = parts[1].split('-'); a = it.start + parseFloat(r[0]); b = r[1] != null ? it.start + parseFloat(r[1]) : a; cut = b < end - 0.01; }
        if (LAYERS[name]) LAYERS[name](C(a, b, chords, 1000 * it.wi + 100 * it.si + k + 11, cut));
        else console.warn('모르는 소리 이름:', name);
      });
      // '배우에게' 질문 카드가 나타날 때 작은 종소리 (extras()와 같은 계산)
      var cs0 = sc.capStart != null ? sc.capStart : 0.4, subT = Math.max(2.7, cs0 + it.segs.length / 11 + 0.4), askT = Math.max(4.6, subT + (sc.capStart ? 1.5 : 1.9));
      var cc = C(it.start, end, chords, 7 + idx), ch = chordInfo(cc, it.start + askT).ch;
      note(cc, it.start + askT, 'box', w.music.root + 24 + ch[2], 0.5, 0.5); note(cc, it.start + askT + 0.16, 'box', w.music.root + 36 + ch[0], 0.4, 0.6);
    }
  });
  EV.sort(function (x, y) { return x.t - y.t; });
})();

// ── 재생 중 소리 예약 ──
var AU = { ac: null, G: null, spk: null, recDest: null, ses: null };
var elSnd = document.getElementById('snd'), elVol = document.getElementById('vol');
function audioReady() {
  if (!AU.ac) {
    var AC = window.AudioContext || window.webkitAudioContext; if (!AC) return null;
    var ac = new AC(); AU.ac = ac; AU.G = buildGraph(ac);
    AU.spk = ac.createGain(); AU.spk.gain.value = +elVol.value; AU.G.out.connect(AU.spk); AU.spk.connect(ac.destination);
    if (ac.createMediaStreamDestination) { AU.recDest = ac.createMediaStreamDestination(); AU.G.out.connect(AU.recDest); }   // 영상 저장용 (볼륨 막대와 상관없이 일정한 크기)
  }
  if (AU.ac.state === 'suspended') AU.ac.resume();
  return AU.ac;
}
function pump(ses, ahead) {
  var horizon = ses.S.ac.currentTime - ses.base + ahead;
  while (ses.i < EV.length && EV[ses.i].t < horizon) {
    var e = EV[ses.i++];
    try {
      if (e.t >= ses.t0) e.fn(ses.S, ses.base + e.t, 0, e.d);
      else if (e.cont && e.t + e.d > ses.t0 + 0.1) { var off = ses.t0 - e.t; e.fn(ses.S, ses.base + ses.t0, off, e.d - off); }
    } catch (err) { console.warn(err); }
  }
}
function audioStart(t0) {
  audioStop();
  if (!elSnd.checked) return null;
  var ac = audioReady(); if (!ac) return null;
  var out = ac.createGain(); out.connect(AU.G.bus);
  var ses = { S: { ac: ac, noise: AU.G.noise, out: out }, base: ac.currentTime + 0.15 - t0, t0: t0, i: 0, timer: 0 };
  ses.timer = setInterval(function () { pump(ses, 1.6); }, 50); pump(ses, 1.6);
  AU.ses = ses; return ses;
}
function audioStop() {
  var ses = AU.ses; if (!ses) return; AU.ses = null; clearInterval(ses.timer);
  var gp = ses.S.out.gain, now = ses.S.ac.currentTime;
  gp.cancelScheduledValues(now); gp.setValueAtTime(gp.value, now); gp.linearRampToValueAtTime(0, now + 0.08);
  setTimeout(function () { try { ses.S.out.disconnect(); } catch (e) { } }, 300);
}

/* =====================================================================
   화면 조작: 재생 / 정지 / 장면 이동 / 소리 / 화질 / 영상 저장
   ===================================================================== */
var playing = false, curT = 0, startMs = 0, raf = 0, onDone = null, recording = false;
var elScrub = document.getElementById('scrub'), elClock = document.getElementById('clock'), elStatus = document.getElementById('status');
elScrub.max = TOTAL.toFixed(2);
function updateUI() {
  elScrub.value = curT; elClock.textContent = curT.toFixed(1) + ' / ' + TOTAL.toFixed(1) + '초';
  var idx = itemAt(curT), btns = document.querySelectorAll('#sceneRow button');
  for (var i = 0; i < btns.length; i++) btns[i].className = (+btns[i].dataset.i === idx) ? 'on' : '';
}
function nowT() {                                    // 소리가 켜져 있으면 소리 시계에 그림을 맞춰요 (어긋나지 않게)
  if (AU.ses) return Math.max(AU.ses.t0, AU.ses.S.ac.currentTime - AU.ses.base);
  return (performance.now() - startMs) / 1000;
}
function tick() {
  if (!playing) return;
  curT = nowT();
  if (curT >= TOTAL) { curT = TOTAL; frame(TOTAL - 0.001); updateUI(); playing = false; audioStop(); if (onDone) { var d = onDone; onDone = null; d(); } return; }
  frame(curT); updateUI(); raf = requestAnimationFrame(tick);
}
function play(done) {
  if (curT >= TOTAL - 0.05) curT = 0;
  onDone = done || null; playing = true; startMs = performance.now() - curT * 1000;
  audioStart(curT);
  cancelAnimationFrame(raf); raf = requestAnimationFrame(tick);
}
function pause() { playing = false; audioStop(); }
function seek(t) {
  curT = clamp(t, 0, TOTAL - 0.001);
  if (playing) { startMs = performance.now() - curT * 1000; audioStart(curT); }
  frame(curT); updateUI();
}
document.getElementById('play').addEventListener('click', function () { if (recording || playing) return; elStatus.textContent = '재생 중… (전체 ' + Math.round(TOTAL) + '초)'; play(function () { elStatus.textContent = '재생 끝'; }); });
document.getElementById('pause').addEventListener('click', function () { if (recording) return; pause(); elStatus.textContent = '일시정지'; });
document.getElementById('stop').addEventListener('click', function () { if (recording) return; pause(); seek(0); elStatus.textContent = '처음으로 돌아왔어요'; });
elScrub.addEventListener('input', function () { if (!recording) seek(parseFloat(elScrub.value)); });
elSnd.addEventListener('change', function () { if (recording) return; if (playing) { curT = nowT(); startMs = performance.now() - curT * 1000; audioStart(curT); } });
elVol.addEventListener('input', function () { if (AU.spk) AU.spk.gain.value = +elVol.value; });
document.getElementById('quality').addEventListener('change', function (e) { if (recording) return; setQuality(+e.target.value); frame(curT); });
(function () {                                       // 장면 바로가기 버튼 (1~16)
  var row = document.getElementById('sceneRow'), lastW = -1;
  items.forEach(function (it, i) {
    if (it.wi !== lastW && it.kind !== 'end') { var s = document.createElement('span'); s.className = 'grp'; s.textContent = '「' + it.w.title + '」'; row.appendChild(s); lastW = it.wi; }
    if (it.kind === 'end') { var s2 = document.createElement('span'); s2.className = 'grp'; s2.textContent = '끝'; row.appendChild(s2); }
    var b = document.createElement('button'); b.type = 'button'; b.dataset.i = i; b.textContent = (i + 1); b.title = it.name;
    b.addEventListener('click', function () { if (recording) return; seek(it.start + STORY.sec.trans + 0.05); });
    row.appendChild(b);
  });
})();
// 캔버스 화면 + 소리를 그대로 녹화해서 .webm 영상 파일로 저장
document.getElementById('rec').addEventListener('click', function () {
  if (!cv.captureStream || !window.MediaRecorder) { elStatus.textContent = '이 브라우저는 영상 저장을 지원하지 않아요. Chrome에서 열어 주세요.'; return; }
  pause(); curT = 0; frame(0);
  var vs = cv.captureStream(30), tracks = vs.getVideoTracks().slice(), withSound = false;
  if (elSnd.checked && audioReady() && AU.recDest) { tracks = tracks.concat(AU.recDest.stream.getAudioTracks()); withSound = true; }
  var cands = withSound ? ['video/webm;codecs=vp9,opus', 'video/webm;codecs=vp8,opus', 'video/webm'] : ['video/webm;codecs=vp9', 'video/webm'];
  var mt = cands.filter(function (m) { return !MediaRecorder.isTypeSupported || MediaRecorder.isTypeSupported(m); })[0] || 'video/webm';
  var rec;
  try { rec = new MediaRecorder(new MediaStream(tracks), { mimeType: mt, videoBitsPerSecond: SCALE > 1 ? 12000000 : 6000000, audioBitsPerSecond: 160000 }); }
  catch (e) { elStatus.textContent = '녹화를 시작하지 못했어요: ' + e.message; return; }
  var ctrls = document.querySelectorAll('button, select, input'); ctrls.forEach(function (b) { b.disabled = true; }); recording = true;
  var chunks = [], fname = 'storybook-mood-' + (SCALE > 1 ? '1080p' : '720p') + '.webm';
  rec.ondataavailable = function (e) { if (e.data.size) chunks.push(e.data); };
  rec.onstop = function () {
    vs.getVideoTracks().forEach(function (t) { t.stop(); });
    var url = URL.createObjectURL(new Blob(chunks, { type: 'video/webm' }));
    var a = document.createElement('a'); a.className = 'dl'; a.href = url; a.download = fname; a.textContent = '⬇ ' + fname + ' 내려받기';
    var row = document.getElementById('dlRow'); row.innerHTML = ''; row.appendChild(a);
    elStatus.textContent = '녹화 완료' + (withSound ? '(소리 포함)' : '(소리 없음)') + '! 아래 버튼으로 내려받으세요.';
    recording = false; ctrls.forEach(function (b) { b.disabled = false; });
  };
  rec.start(1000);
  elStatus.textContent = '녹화 중… ' + Math.round(TOTAL) + '초 동안 이 탭을 닫거나 다른 탭으로 옮기지 마세요.';
  play(function () { setTimeout(function () { rec.stop(); }, 400); });
});

setQuality(+document.getElementById('quality').value);
seek(1.2);   // 첫 화면 미리 그리기
</script>
