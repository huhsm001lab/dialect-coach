<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>동화책 무드 영상</title>
<style>
  /* 신춘문예 희곡 3편을 읽고 떠올린 상상 장면을 '그림책이 살아 움직이는' 영상으로 보여 주는 페이지 */
  :root { --bg:#14110e; --text:#f1ebe0; --muted:#b9ae9c; --accent:#e58a92; }
  body { margin:0; background:var(--bg); color:var(--text); font-family:"Malgun Gothic","Apple SD Gothic Neo",sans-serif; }
  .wrap { max-width:1000px; margin:0 auto; padding:16px; }
  h1 { font-size:1.3rem; margin:8px 0; }
  p.note { color:var(--muted); line-height:1.6; margin:4px 0 12px; }
  canvas { width:100%; height:auto; aspect-ratio:16/9; background:#000; border-radius:10px; display:block; }
  .row { display:flex; flex-wrap:wrap; gap:10px; margin:12px 0; align-items:center; }
  button, a.dl { min-height:44px; padding:8px 18px; border-radius:10px; border:2px solid var(--accent); background:transparent;
    color:var(--accent); font:inherit; font-weight:700; cursor:pointer; text-decoration:none; display:inline-flex; align-items:center; }
  button.primary { background:var(--accent); color:#2a0f12; }
  button:disabled { opacity:.5; cursor:not-allowed; }
  #status, #clock { color:var(--muted); }
  #scrub { flex:1 1 260px; min-width:200px; accent-color:var(--accent); }
  .scenes { display:flex; flex-wrap:wrap; gap:6px; align-items:center; }
  .scenes .grp { color:var(--muted); font-size:.85rem; margin:0 2px 0 8px; }
  .scenes button { min-height:36px; min-width:36px; padding:2px 8px; font-size:.9rem; }
  .scenes button.on { background:var(--accent); color:#2a0f12; }
</style>
</head>
<body>
<div class="wrap">
  <h1>📖 동화책 무드 영상</h1>
  <p class="note">신춘문예 희곡 3편의 작품 소개를 읽고 <b>떠올린 상상 장면</b>을 그림책처럼 그려 본 무드 영상이에요.
     원작 장면을 그대로 옮긴 것이 아니고 대사도 인용하지 않았어요. 배우가 장면의 분위기와 감정을 그림으로 먼저 느껴 보는 연습용이에요.
     그림은 모두 화면에서 직접 그린 것이라 저작권 걱정이 없어요.</p>
  <canvas id="cv" width="1280" height="720" aria-label="동화책 스타일 무드 영상 화면"></canvas>
  <div class="row">
    <button id="play" class="primary" type="button">▶ 재생</button>
    <button id="pause" type="button">⏸ 일시정지</button>
    <button id="stop" type="button">■ 정지(처음으로)</button>
    <input id="scrub" type="range" min="0" max="100" step="0.01" value="0" aria-label="영상 위치">
    <span id="clock">0.0 / 0.0초</span>
  </div>
  <div class="row scenes" id="sceneRow" aria-label="장면으로 바로가기"></div>
  <div class="row">
    <button id="rec" type="button">⏺ 영상 파일로 저장 (.webm)</button>
    <span id="status" role="status" aria-live="polite"></span>
  </div>
  <div class="row" id="dlRow"></div>
</div>
<script>
/* =====================================================================

   - text      : 화면 아래에 한 글자씩 나타나는 내레이션
   - capStart  : (선택) 글자가 나타나기 시작하는 초 (기본 0.6초)
   - cam       : [시작 확대, 끝 확대, 시작 x이동, 시작 y이동, 끝 x이동, 끝 y이동] (켄 번즈, 아주 느린 카메라)
   - colors    : dark(가장 어두운 색) / accent(포인트 색) / light(밝은 종이색)  → 장면 색이 이 3색에서 만들어져요
   ===================================================================== */
var STORY = {
  corner: '작품을 읽고 떠올린 상상 장면 · 원작 장면 재현 아님 · 요약 기반 해석',
  sec: { title: 3, scene: 7, end: 3.5, trans: 0.9 },   // 제목 카드 / 장면 / 마무리 / 장면 사이 전환 길이(초)
  works: [
    { // ───── ① 실화를 바탕으로 함 : 흙갈색 · 호박색 · 바랜 종이색
      title: '실화를 바탕으로 함', author: '김정민', paper: '한국일보', year: 2026, category: '희곡',

          sub: '(할머니) 이 아이에게만큼은 멋진 할아버지로 남기고 싶다', ask: '이야기를 꺼내기 전, 할머니는 무엇을 고르고 무엇을 빼고 있을까?',      cam: [1.05, 1.12, -8, 6, 8, -4] },     // 1) 등잔불 방
        { text: '바랜 사진 속에서 젊은 날의 할아버지가 걸어 나온다',

        { text: '분노는 그를 북쪽 끝까지 데려갔다',

        { text: '어디까지가 진짜였을까. 그래도, 이야기는 남았다',
          sub: '(할머니) 진짜가 아니어도, 이 아이가 기억할 이야기가 필요했다', ask: '거짓말인 걸 들켰을 때, 할머니는 부끄러울까 아니면 후련할까?',   cam: [1.05, 1.15, 6, 2, 22, 8] }       // 4) 다시 방(사진이 흐려짐)
      ]
    },
    { // ───── ② 꿈에서 아빠 죽이기 : 짙은 남색 · 주홍 · 크림
      title: '꿈에서 아빠 죽이기', author: '한동엽', paper: '매일신문', year: 2026, category: '희곡',
      chapter: '두 번째 이야기',
      colors: { dark: '#2B3A55', accent: '#E4572E', light: '#F2E9DC' },
      scenes: [
        { text: '열대야. 선풍기만 쉬지 않고 고개를 돌린다',
          sub: '(남매) 이 더위도, 이 집도, 저 사람도 지긋지긋하다', ask: '짜증 아래에 숨어 있는 진짜 감정은 무엇일까?',       cam: [1.05, 1.11, -10, 0, 10, 4] },    // 1) 열대야 방
        { text: '꿈속에서 남매는 작전을 짠다',
          sub: '(남매) 꿈에서라면, 한 번쯤은 이겨 보고 싶다', ask: '꿈속의 나는 현실의 나보다 무엇이 더 용감한가?',                     cam: [1.06, 1.12, 8, 4, -8, -2] },     // 2) 기울어진 꿈의 방

          sub: '(남매) 정말 끝내고 싶은 걸까, 봐 주길 바라는 걸까', ask: '아빠가 움직이는 순간, 당신의 첫 반응은 공포인가 안도인가?',               cam: [1.05, 1.13, 0, 8, 0, -6] },      // 3) 이불 들썩임
        { text: '깨어나도, 여름밤은 끝나지 않았다',
          sub: '(남매) 아무것도 달라지지 않았다. 그래도 오늘도 이 방에 있다', ask: '떠나지 못하는 이유를 한 단어로 말한다면?',                 cam: [1.05, 1.11, 8, -2, -8, 4] }      // 4) 새벽빛
      ]
    },
    { // ───── ③ 홀드 : 깊은 청록 · 살구 · 아이보리
      title: '홀드', author: '김재은', paper: '부산일보', year: 2026, category: '희곡',
      chapter: '세 번째 이야기',
      colors: { dark: '#1F4E5F', accent: '#F4A259', light: '#F5F1E8' },
      scenes: [
        { text: '손을 맞잡으면, 음악이 시작됐다',
          sub: '(지우) 이 손을 잡으면 세상에서 제일 자유롭다', ask: '당신이 가장 ‘나답다’고 느끼는 순간의 몸은 어떤 모양인가?',                 cam: [1.05, 1.12, 0, 6, 0, -4] },      // 1) 무도회장
        { text: '그리고 어느 날, 음악이 멈췄다',
          sub: '(지우) ……아무 생각도 나지 않는다', ask: '큰일이 일어난 직후, 사람은 소리를 지를까 아니면 조용해질까?', capStart: 2.7,    cam: [1.04, 1.1, 0, 0, 0, 0] },        // 2) 비 오는 밤길(사고는 보여 주지 않음)
        { text: '멈춘 자리에서, 오래 창밖만 보았다',
          sub: '(지우) 다시는 춤출 수 없다고, 스스로 먼저 정해 버렸다', ask: '절망을 연기할 때, 울기 전에 무엇을 ‘하지 않는’ 사람인가?',               cam: [1.05, 1.12, -12, 2, 8, -2] },    // 3) 창가의 휠체어
        { text: '다시, 손을 잡는다',
          sub: '(지우) 다리가 아니라 손이 기억하고 있었다', ask: '다시 손을 잡기까지 필요한 건 용기일까, 허락일까?',                               cam: [1.05, 1.14, 0, 8, 0, -4] }       // 4) 함께 회전
      ]
    }
  ],
  end: { lines: ['장면을 상상하고, 속마음을 먼저 느껴 보세요.', '대사는 그다음입니다.'], sub: '배우의 대본 저장소 · 대본 분석 스튜디오' }
};
var SERIF = '"Batang","Nanum Myeongjo","Noto Serif KR",serif';
var SANS = '"Malgun Gothic","Apple SD Gothic Neo",sans-serif';

/* =====================================================================
   ② 아래부터는 그림 그리는 코드예요 (초보자는 건드리지 않아도 돼요)
   ===================================================================== */
var cv = document.getElementById('cv');
var ctx = cv.getContext('2d');
var W = 1280, H = 720;
var g = ctx;            // 지금 그리는 대상 캔버스 (전환 때 잠깐 바뀌어요)
var GT = 0;             // 영상 전체 시간(초) — 모든 움직임은 이 값으로만 계산해요 (같은 시간 = 같은 그림)
var PAL = null;         // 지금 작품의 색 {D, A, L, INK}

// ── 오프스크린 캔버스: 종이 질감, 비네트, 전환용, 아지랑이용 ──
function mk(w, h) { var c = document.createElement('canvas'); c.width = w; c.height = h; return c; }
var tcv = mk(W, H), tg = tcv.getContext('2d');       // 전환 때 '이전 장면'을 담아 두는 곳
var fxc = mk(W, H), fxg = fxc.getContext('2d');      // 아지랑이 효과용
var grainC = mk(1400, 820), vigC = mk(W, H);

// ── 숫자 도구들 ──
function clamp(x, a, b) { return x < a ? a : x > b ? b : x; }
function ease(x) { x = clamp(x, 0, 1); return x * x * (3 - 2 * x); }
function lerp(a, b, t) { return a + (b - a) * t; }
function bump(t, c, w) { var d = (t - c) / w; return Math.exp(-d * d); }
var SEED = 7;
function hsh(i, j) { var n = Math.sin(i * 127.1 + j * 311.7 + SEED * 17.3) * 43758.5453; return n - Math.floor(n); }   // 시드 고정 난수(같은 입력=같은 값)
function vnoise(x, y) {                                                                                           // 부드러운 노이즈
  var xi = Math.floor(x), yi = Math.floor(y), xf = x - xi, yf = y - yi;
  var u = xf * xf * (3 - 2 * xf), v = yf * yf * (3 - 2 * yf);
  var a = hsh(xi, yi), b = hsh(xi + 1, yi), c = hsh(xi, yi + 1), d = hsh(xi + 1, yi + 1);
  return lerp(lerp(a, b, u), lerp(c, d, u), v);
}
function mulberry(a) { return function () { a |= 0; a = a + 0x6D2B79F5 | 0; var t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }

// ── 색 도구들 ──
function hex(h) { var n = parseInt(h.slice(1), 16); return [(n >> 16) & 255, (n >> 8) & 255, n & 255]; }
function rgb(c, a) { return 'rgba(' + (c[0] | 0) + ',' + (c[1] | 0) + ',' + (c[2] | 0) + ',' + (a == null ? 1 : a) + ')'; }
function mix(a, b, t) { return [a[0] + (b[0] - a[0]) * t, a[1] + (b[1] - a[1]) * t, a[2] + (b[2] - a[2]) * t]; }
var BLACK = [0, 0, 0], WHITE = [255, 255, 255];
function cs(c) { return typeof c === 'string' ? c : rgb(c, 1); }
function edge(c) { return rgb(mix(c, BLACK, 0.4), 0.85); }
function grad(x0, y0, x1, y1, st) { var q = g.createLinearGradient(x0, y0, x1, y1); for (var i = 0; i < st.length; i++) q.addColorStop(st[i][0], rgb(st[i][1], st[i][2])); return q; }
function glow(x, y, r, c, a) {
  if (r <= 0 || a <= 0) return;
  var q = g.createRadialGradient(x, y, 0, x, y, r);
  q.addColorStop(0, rgb(c, a)); q.addColorStop(0.5, rgb(c, a * 0.35)); q.addColorStop(1, rgb(c, 0));
  g.fillStyle = q; g.fillRect(x - r, y - r, r * 2, r * 2);
}

// ── 손그림 선: 점 위치를 느리게 변하는 노이즈로 살짝(약 2px) 흔들어요 ──
var JA = 6, JX = 0, JY = 0;
function wobXY(x, y) {
  var t = GT * 0.7;
  JX = x + (vnoise(x * 0.025 + t, y * 0.025) - 0.5) * JA;
  JY = y + (vnoise(x * 0.025 + 7.7, y * 0.025 + t) - 0.5) * JA;
}
// P: 점 목록 [x,y,x,y,...] 으로 모양을 그려요. open=true면 닫지 않는 선
function P(p, fill, stroke, lw, open) {
  var n = p.length >> 1; if (n < 2) return;
  g.beginPath();
  var first = true, last = open ? n - 1 : n;
  for (var i = 0; i < last; i++) {
    var x0 = p[2 * i], y0 = p[2 * i + 1], j = (i + 1) % n, x1 = p[2 * j], y1 = p[2 * j + 1];
    var k = Math.max(1, Math.ceil(Math.hypot(x1 - x0, y1 - y0) / 18));
    for (var s = 0; s < k; s++) {
      var u = s / k; wobXY(x0 + (x1 - x0) * u, y0 + (y1 - y0) * u);
      if (first) { g.moveTo(JX, JY); first = false; } else g.lineTo(JX, JY);
    }
  }
  if (open) { wobXY(p[2 * n - 2], p[2 * n - 1]); g.lineTo(JX, JY); } else g.closePath();
  if (fill) { g.fillStyle = cs(fill); g.fill(); }
  if (stroke) { g.strokeStyle = cs(stroke); g.lineWidth = lw || 2; g.lineJoin = 'round'; g.lineCap = 'round'; g.stroke(); }
}
var EB = [];
function E(cx, cy, rx, ry, fill, stroke, lw, rot) {
  var n = Math.max(12, Math.min(40, Math.ceil((rx + ry) / 3))), cr = Math.cos(rot || 0), sr = Math.sin(rot || 0);
  EB.length = 0;
  for (var i = 0; i < n; i++) { var a = i / n * 6.2832, ux = Math.cos(a) * rx, uy = Math.sin(a) * ry; EB.push(cx + ux * cr - uy * sr, cy + ux * sr + uy * cr); }
  P(EB, fill, stroke, lw);
}
function Ef(cx, cy, rx, ry, col, rot) { E(cx, cy, rx, ry, rgb(col, 1), edge(col), 2, rot); }
function Pf(p, col) { P(p, rgb(col, 1), edge(col), 2); }
function limb(x1, y1, x2, y2, w1, w2, col) {
  var dx = x2 - x1, dy = y2 - y1, L = Math.hypot(dx, dy) || 1, nx = -dy / L, ny = dx / L;
  Pf([x1 + nx * w1 / 2, y1 + ny * w1 / 2, x2 + nx * w2 / 2, y2 + ny * w2 / 2, x2 - nx * w2 / 2, y2 - ny * w2 / 2, x1 - nx * w1 / 2, y1 - ny * w1 / 2], col);
  Ef(x1, y1, w1 / 2, w1 / 2, col); Ef(x2, y2, w2 / 2, w2 / 2, col);
}
function star(x, y, r, rot, col, a) {            // 반짝이는 4갈래 별
  g.save(); g.translate(x, y); g.rotate(rot); g.beginPath();
  for (var i = 0; i < 8; i++) { var rr = i % 2 ? r * 0.22 : r, an = i * Math.PI / 4; g.lineTo(Math.cos(an) * rr, Math.sin(an) * rr); }
  g.closePath(); g.fillStyle = rgb(col, a); g.fill(); g.restore();
}
// 빛 가루: 아래에서 위로 천천히 떠오르며 깜빡이는 점들
function dust(n, cx, cy, sx, sy, col, aMax, speed, seed) {
  for (var i = 0; i < n; i++) {
    var u = (hsh(i, seed + 3) + GT * speed * (0.5 + hsh(i, seed + 4))) % 1;
    var x = cx + (hsh(i, seed + 1) - 0.5) * sx * (0.5 + u * 0.5) + Math.sin(GT * 0.8 + i) * 10;
    var y = cy - u * sy + (hsh(i, seed + 2) - 0.5) * sy * 0.3;
    g.fillStyle = rgb(col, Math.sin(Math.PI * u) * aMax); g.beginPath(); g.arc(x, y, 1.2 + 2.4 * hsh(i, seed + 5), 0, 6.283); g.fill();
  }
}

/* ───────────── 사람 그림(얼굴 없는 실루엣) ───────────── */
// 서 있는 사람. 발 위치 (x,y), 크기 s. o.walk=걸음 위상, o.hat=모자, o.hem=옷자락 흔들림, o.scarf=목도리
function person(x, y, s, col, o) {
  o = o || {}; var dir = o.dir || 1, hipY = y - 90 * s, shY = y - 144 * s;
  var sw = o.walk != null ? Math.sin(o.walk) : 0;

  g.drawImage(fxc, 0, 0);

  for (var y = 0; y < H; y += 4) g.drawImage(fxc, 0, y, W, 4, Math.sin(y * 0.05 + GT * 2.6) * amp + Math.sin(y * 0.013 - GT * 1.1) * amp, y, W, 4);
}
function compose(prev, cur, pu) {
  var e = ease(pu);
  if (prev.kind === 'scene' && cur.kind === 'scene') {            // 부드러운 겹침 + 종이 테두리
    g.save(); g.globalAlpha = 1 - e; g.drawImage(tcv, 0, 0); g.restore();
    P([14, 14, W - 14, 14, W - 14, H - 14, 14, H - 14], null, rgb([246, 238, 220], 0.9 * Math.sin(Math.PI * pu)), 26);
  } else {                                                       // 책장 넘김: 오른쪽에서 왼쪽으로 종이가 접혀 넘어가요
    var xf = W * (1 - e), bw = Math.min(W - xf, 30 + 150 * Math.sin(Math.PI * e));
    g.save(); g.beginPath(); g.rect(0, 0, xf, H); g.clip(); g.drawImage(tcv, 0, 0);
    var sh = g.createLinearGradient(xf - bw - 80, 0, xf - bw, 0); sh.addColorStop(0, 'rgba(0,0,0,0)'); sh.addColorStop(1, 'rgba(0,0,0,0.25)');
    g.fillStyle = sh; g.fillRect(xf - bw - 80, 0, 80, H); g.restore();
    var ns = g.createLinearGradient(xf, 0, xf + 130, 0); ns.addColorStop(0, 'rgba(0,0,0,0.42)'); ns.addColorStop(1, 'rgba(0,0,0,0)');
    g.fillStyle = ns; g.fillRect(xf, 0, 130, H);
    var bg = g.createLinearGradient(xf - bw, 0, xf, 0);                                    // 넘어간 종이의 뒷면
    bg.addColorStop(0, 'rgb(250,243,226)'); bg.addColorStop(0.7, 'rgb(236,225,200)'); bg.addColorStop(1, 'rgb(188,172,140)');
    g.fillStyle = bg; g.fillRect(xf - bw, 0, bw, H);
    P([xf - bw, 0, xf - bw, H], null, 'rgba(120,100,70,0.5)', 2, true); P([xf, 0, xf, H], null, 'rgba(255,250,235,0.9)', 2, true);
  }
}

/* =====================================================================
   한 프레임 그리기: frame(t) — 시간 t(초)만 알면 같은 그림이 나와요
   ===================================================================== */
// 종이 질감(한 번만 미리 그려 두고 매 프레임 살짝 얹어요)
(function () {
  var gc = grainC.getContext('2d'), rnd = mulberry(12345), i;
  for (i = 0; i < 11000; i++) { gc.fillStyle = rnd() > 0.5 ? 'rgba(70,48,24,' + (0.12 + rnd() * 0.25).toFixed(2) + ')' : 'rgba(255,250,235,' + (0.15 + rnd() * 0.3).toFixed(2) + ')'; var sz = 0.8 + rnd() * 1.6; gc.fillRect(rnd() * 1400, rnd() * 820, sz, sz); }
  for (i = 0; i < 700; i++) {
    gc.strokeStyle = rnd() > 0.5 ? 'rgba(110,85,50,0.12)' : 'rgba(255,248,230,0.16)'; gc.lineWidth = 0.7 + rnd() * 0.6;
    var x = rnd() * 1400, y = rnd() * 820, a = rnd() * 6.28, l = 8 + rnd() * 20;
    gc.beginPath(); gc.moveTo(x, y); gc.quadraticCurveTo(x + Math.cos(a) * l * 0.6 + rnd() * 6, y + Math.sin(a) * l * 0.6 + rnd() * 6, x + Math.cos(a) * l, y + Math.sin(a) * l); gc.stroke();
  }
  var vc = vigC.getContext('2d'), vg = vc.createRadialGradient(W / 2, H / 2, H * 0.45, W / 2, H / 2, W * 0.72);
  vg.addColorStop(0, 'rgba(20,10,5,0)'); vg.addColorStop(1, 'rgba(20,10,5,0.55)'); vc.fillStyle = vg; vc.fillRect(0, 0, W, H);
})();
function frame(t) {
  t = clamp(t, 0, TOTAL - 0.001); GT = t;
  var idx = itemAt(t), it = items[idx], local = t - it.start, tr = STORY.sec.trans;
  if (idx > 0 && local < tr) {
    var prev = items[idx - 1];
    drawItem(tg, prev, prev.dur + local);          // 이전 장면은 따로 그려 두고
    drawItem(ctx, it, local);                      // 새 장면은 화면에 그린 뒤
    g = ctx; PAL = it.pal; compose(prev, it, local / tr);   // 두 장면을 책장 넘김/겹침으로 합쳐요
  } else drawItem(ctx, it, local);
  g = ctx;
  // 종이 질감 + 비네트
  var k = Math.floor(GT * 5);
  g.globalAlpha = 0.5; g.drawImage(grainC, -Math.floor(hsh(k, 1) * 110), -Math.floor(hsh(k, 2) * 90)); g.globalAlpha = 1;
  g.drawImage(vigC, 0, 0);
  // 시작과 끝 페이드
  var fa = Math.max(1 - t / 0.6, 0, (t - (TOTAL - 0.7)) / 0.7);
  if (fa > 0) { g.fillStyle = 'rgba(10,8,6,' + clamp(fa, 0, 1).toFixed(3) + ')'; g.fillRect(0, 0, W, H); }
  // 모서리 안내 문구
  g.font = '15px ' + SANS; g.textAlign = 'left'; g.textBaseline = 'middle';
  var lw = g.measureText(STORY.corner).width + 24;
  g.fillStyle = 'rgba(15,10,6,0.45)'; g.fillRect(14, 14, lw, 28);
  g.fillStyle = 'rgba(250,244,230,0.9)'; g.fillText(STORY.corner, 26, 29);
}

/* =====================================================================
   화면 조작: 재생 / 정지 / 장면 이동 / 영상 저장
   ===================================================================== */
var playing = false, curT = 0, startMs = 0, raf = 0, onDone = null, recording = false;
var elScrub = document.getElementById('scrub'), elClock = document.getElementById('clock'), elStatus = document.getElementById('status');
elScrub.max = TOTAL.toFixed(2);
function updateUI() {
  elScrub.value = curT; elClock.textContent = curT.toFixed(1) + ' / ' + TOTAL.toFixed(1) + '초';
  var idx = itemAt(curT), btns = document.querySelectorAll('#sceneRow button');
  for (var i = 0; i < btns.length; i++) btns[i].className = (+btns[i].dataset.i === idx) ? 'on' : '';
}
function tick(now) {
  if (!playing) return;
  curT = (now - startMs) / 1000;
  if (curT >= TOTAL) { curT = TOTAL; frame(TOTAL - 0.001); updateUI(); playing = false; if (onDone) { var d = onDone; onDone = null; d(); } return; }
  frame(curT); updateUI(); raf = requestAnimationFrame(tick);
}
function play(done) {
  if (curT >= TOTAL - 0.05) curT = 0;
  onDone = done || null; playing = true; startMs = performance.now() - curT * 1000;
  cancelAnimationFrame(raf); raf = requestAnimationFrame(tick);
}
function seek(t) { curT = clamp(t, 0, TOTAL - 0.001); if (playing) startMs = performance.now() - curT * 1000; frame(curT); updateUI(); }
document.getElementById('play').addEventListener('click', function () { if (recording) return; elStatus.textContent = '재생 중… (전체 ' + Math.round(TOTAL) + '초)'; play(function () { elStatus.textContent = '재생 끝'; }); });
document.getElementById('pause').addEventListener('click', function () { if (recording) return; playing = false; elStatus.textContent = '일시정지'; });
document.getElementById('stop').addEventListener('click', function () { if (recording) return; playing = false; seek(0); elStatus.textContent = '처음으로 돌아왔어요'; });
elScrub.addEventListener('input', function () { if (!recording) seek(parseFloat(elScrub.value)); });
(function () {                                       // 장면 바로가기 버튼 (1~16)
  var row = document.getElementById('sceneRow'), lastW = -1;
  items.forEach(function (it, i) {
    if (it.wi !== lastW && it.kind !== 'end') { var s = document.createElement('span'); s.className = 'grp'; s.textContent = '「' + it.w.title + '」'; row.appendChild(s); lastW = it.wi; }
    if (it.kind === 'end') { var s2 = document.createElement('span'); s2.className = 'grp'; s2.textContent = '끝'; row.appendChild(s2); }
    var b = document.createElement('button'); b.type = 'button'; b.dataset.i = i; b.textContent = (i + 1); b.title = it.name;
    b.addEventListener('click', function () { if (recording) return; seek(it.start + STORY.sec.trans + 0.05); });
    row.appendChild(b);
  });
})();
// 캔버스 화면을 그대로 녹화해서 .webm 영상 파일로 저장 (소리 없는 영상)
document.getElementById('rec').addEventListener('click', function () {
  if (!cv.captureStream || !window.MediaRecorder) { elStatus.textContent = '이 브라우저는 영상 저장을 지원하지 않아요. Chrome에서 열어 주세요.'; return; }
  var btns = document.querySelectorAll('button'); btns.forEach(function (b) { b.disabled = true; }); recording = true;
  var chunks = [], mt = 'video/webm';
  if (MediaRecorder.isTypeSupported && MediaRecorder.isTypeSupported('video/webm;codecs=vp9')) mt = 'video/webm;codecs=vp9';
  var rec = new MediaRecorder(cv.captureStream(30), { mimeType: mt, videoBitsPerSecond: 6000000 });
  rec.ondataavailable = function (e) { if (e.data.size) chunks.push(e.data); };
  rec.onstop = function () {
    var url = URL.createObjectURL(new Blob(chunks, { type: 'video/webm' }));
    var a = document.createElement('a'); a.className = 'dl'; a.href = url; a.download = 'storybook-mood.webm'; a.textContent = '⬇ storybook-mood.webm 내려받기';
    var row = document.getElementById('dlRow'); row.innerHTML = ''; row.appendChild(a);
    elStatus.textContent = '녹화 완료! 아래 버튼으로 내려받으세요.'; recording = false; btns.forEach(function (b) { b.disabled = false; });
  };
  playing = false; curT = 0; frame(0); rec.start();
  elStatus.textContent = '녹화 중… ' + Math.round(TOTAL) + '초 동안 이 탭을 닫거나 다른 탭으로 옮기지 마세요.';
  play(function () { setTimeout(function () { rec.stop(); }, 250); });
});

seek(1.2);   // 첫 화면 미리 그리기
</script>
